name: Build OpenWrt packages

# This repo only holds the package *sources* (Makefiles, UCI config, init
# script, LuCI files) -- not the OpenWrt SDK. Each matrix target's SDK
# (~50-100MB) is downloaded fresh from downloads.openwrt.org and cached by
# actions/cache, so normal runs restore it from cache instead of
# re-downloading/extracting it every time.
#
# Builds a mipsel-24kec .ipk (ramips/mt76x8, e.g. MT76x8 routers), a
# mips-24kc .ipk (ath79/generic, e.g. AR9331 boards), and an arm64/aarch64
# .ipk (bcm27xx/bcm2711, e.g. Raspberry Pi 4) -- the clusterduckd Makefile
# auto-selects the matching upstream release asset via $(ARCH). On push to
# main / workflow_dispatch (not pull_request), all three .ipk files are
# also published as assets on a GitHub Release.
#
# clusterduckd ships with `option enabled '0'` by default, so the built
# .ipk installs with the service disabled until enabled via UCI/LuCI.

on:
  push:
    branches: [main]
    paths:
      - "package/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "package/**"
  workflow_dispatch:
    inputs:
      clusterduckd_version:
        description: >
          clusterduckd release tag to build, e.g. "v1.2.3". Use "latest" to
          resolve the newest GitHub release at build time. Leave empty to
          use the version already pinned in the package Makefile.
        required: false
        default: ""

env:
  OPENWRT_VERSION: "21.02.3"

jobs:
  create-release:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4

      # Tags the release by the clusterduckd version being built (e.g.
      # "v1.2.2"), not the run number -- either the requested
      # workflow_dispatch version/"latest", or the version already pinned
      # in the checked-in Makefile.
      - name: Determine clusterduckd version being built
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.clusterduckd_version }}
        run: |
          set -e
          if [ -n "$REQUESTED_VERSION" ]; then
            TAG="$REQUESTED_VERSION"
            if [ "$TAG" = "latest" ]; then
              TAG=$(curl -fsSL https://api.github.com/repos/MeshBeacon/meshbeacon-uplink/releases/latest | jq -r .tag_name)
            fi
            VERSION="${TAG#v}"
          else
            VERSION=$(sed -n 's/^PKG_VERSION:=\(.*\)/\1/p' package/network/services/clusterduckd/Makefile)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Re-running the workflow for a version that's already been released
      # (e.g. a doc-only follow-up commit) just reuses the existing release;
      # the build job's --clobber upload replaces its .ipk assets.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; build job will update its assets."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "clusterduckd $TAG" \
              --notes "Automated .ipk build of clusterduckd $TAG (commit ${{ github.sha }})." \
              --prerelease
          fi

  build:
    needs: [create-release]
    if: ${{ always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ramips
            subtarget: mt76x8
            sdk_gcc_suffix: "gcc-8.4.0_musl"
            arch_suffix: linux-mipsel-24kec
            artifact_label: mipsel-24kec
          - target: ath79
            subtarget: generic
            sdk_gcc_suffix: "gcc-8.4.0_musl"
            arch_suffix: linux-mips-24kc
            artifact_label: mips-24kc
          - target: bcm27xx
            subtarget: bcm2711
            sdk_gcc_suffix: "gcc-8.4.0_musl"
            arch_suffix: linux-arm64
            artifact_label: arm64
    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4

      - name: Resolve SDK name/URL
        id: sdk
        run: |
          SDK_NAME="openwrt-sdk-${OPENWRT_VERSION}-${{ matrix.target }}-${{ matrix.subtarget }}_${{ matrix.sdk_gcc_suffix }}.Linux-x86_64"
          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/${SDK_NAME}.tar.xz"
          echo "sdk_name=${SDK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sdk_url=${SDK_URL}" >> "$GITHUB_OUTPUT"
          echo "sdk_dir=${{ github.workspace }}/sdk/${SDK_NAME}" >> "$GITHUB_OUTPUT"

      # Cached by a fixed key (a given release's SDK tarball never changes),
      # so after the first run per target this step is a no-op.
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk/${{ steps.sdk.outputs.sdk_name }}
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.sdk_gcc_suffix }}-v1

      - name: Download and extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p sdk
          curl -fL --retry 5 "${{ steps.sdk.outputs.sdk_url }}" -o /tmp/sdk.tar.xz
          tar -C sdk -xJf /tmp/sdk.tar.xz

      - name: Drop our packages into the SDK tree
        run: |
          DEST="${{ steps.sdk.outputs.sdk_dir }}/package/network/services"
          rm -rf "$DEST/clusterduckd" "$DEST/luci-app-clusterduckd"
          mkdir -p "$DEST"
          cp -r package/network/services/clusterduckd "$DEST/"
          cp -r package/network/services/luci-app-clusterduckd "$DEST/"

      # Overrides PKG_VERSION/PKG_HASH for this run only -- the checked-in
      # Makefile keeps its own pinned default and is never modified.
      - name: Resolve clusterduckd version override
        if: ${{ github.event.inputs.clusterduckd_version != '' }}
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.clusterduckd_version }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
        run: |
          set -e
          TAG="$REQUESTED_VERSION"
          if [ "$TAG" = "latest" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/MeshBeacon/meshbeacon-uplink/releases/latest | jq -r .tag_name)
          fi
          VERSION="${TAG#v}"
          ASSET="clusterduckd-${TAG}-${ARCH_SUFFIX}"
          URL="https://github.com/MeshBeacon/meshbeacon-uplink/releases/download/${TAG}/${ASSET}"

          echo "Resolved clusterduckd ${TAG} (${URL})"
          mkdir -p dl
          curl -fL --retry 5 "$URL" -o "dl/${ASSET}"
          HASH=$(sha256sum "dl/${ASSET}" | cut -d' ' -f1)

          MAKEFILE=package/network/services/clusterduckd/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" "$MAKEFILE"
          # Only patch the branch matching this matrix job's architecture,
          # leaving the other two architectures' pinned assets/hashes
          # untouched (ifeq aarch64 / else ifeq mips / else mipsel / endif).
          case "$ARCH_SUFFIX" in
            linux-arm64)
              sed -i "/^ifeq (\$(ARCH),aarch64)/,/^else ifeq (\$(ARCH),mips)/{s/^\(\s*PKG_SOURCE:=\).*/\1${ASSET}/; s/^\(\s*PKG_HASH:=\).*/\1${HASH}/}" "$MAKEFILE"
              ;;
            linux-mips-24kc)
              sed -i "/^else ifeq (\$(ARCH),mips)/,/^else$/{s/^\(\s*PKG_SOURCE:=\).*/\1${ASSET}/; s/^\(\s*PKG_HASH:=\).*/\1${HASH}/}" "$MAKEFILE"
              ;;
            *)
              sed -i "/^else$/,/^endif/{s/^\(\s*PKG_SOURCE:=\).*/\1${ASSET}/; s/^\(\s*PKG_HASH:=\).*/\1${HASH}/}" "$MAKEFILE"
              ;;
          esac

      - name: make defconfig
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: make defconfig

      - name: Build clusterduckd
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: make package/network/services/clusterduckd/{clean,compile} V=s

      - name: Build luci-app-clusterduckd
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: make package/network/services/luci-app-clusterduckd/{clean,compile} V=s

      # The exact bin/packages/<arch>/ directory name (e.g. mipsel_24kc,
      # aarch64_cortex-a72) comes from each target's own SDK config, not
      # something we should hardcode per matrix entry.
      - name: Resolve built package arch directory
        id: pkgarch
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          ARCH_PACKAGES=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/\1/p' .config)
          echo "arch_packages=${ARCH_PACKAGES}" >> "$GITHUB_OUTPUT"

      - name: Upload .ipk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clusterduckd-ipk-${{ matrix.artifact_label }}
          path: sdk/${{ steps.sdk.outputs.sdk_name }}/bin/packages/${{ steps.pkgarch.outputs.arch_packages }}/base/*.ipk
          if-no-files-found: error

      - name: Publish .ipk to GitHub Release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            sdk/${{ steps.sdk.outputs.sdk_name }}/bin/packages/${{ steps.pkgarch.outputs.arch_packages }}/base/*.ipk
